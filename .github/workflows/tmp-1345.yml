name: tmp-1345

on:
  push:
    branches: ['tmp/ci-hunt-tools-1345']

permissions:
  contents: read

jobs:
  window-thread:
    strategy:
      fail-fast: false
      matrix:
        placement: [fixed, old]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: The lock held while asking the window, as before 94e09c3cd
        if: matrix.placement == 'old'
        run: git show 94e09c3cd -- apps/desktop/src-tauri/src/placement.rs | git apply -R

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-pc-windows-msvc

      - name: Frontend
        run: pnpm --filter @orden/desktop build

      - name: Clippy, every target
        if: matrix.placement == 'fixed'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: The window's thread, three times
        timeout-minutes: 30
        run: |
          fails=0
          for n in 1 2 3; do
            echo "=== run $n"
            cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test window_thread -- --ignored --nocapture || fails=$((fails+1))
          done
          echo "failed runs: $fails of 3"
          [ "$fails" = 0 ]
